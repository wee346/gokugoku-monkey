<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

.ggm-root {
  --bg: #170f22;
  --bg-panel: #221733;
  --bg-panel-2: #2c1f42;
  --poison: #6bd968;
  --antidote: #4d96ff;
  --gold: #ffc23c;
  --danger: #ff5d73;
  --cream: #f6f0e6;
  --muted: #a89bc2;
  --line: #3d2c58;

  font-family: 'Zen Maru Gothic', sans-serif;
  background: radial-gradient(ellipse at top, #241a35 0%, var(--bg) 65%);
  color: var(--cream);
  min-height: 100%;
  padding: 28px 16px 60px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
}

.ggm-root * { box-sizing: border-box; }

.ggm-shell {
  width: 100%;
  max-width: 480px;
}

.ggm-logo {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 30px;
  text-align: center;
  letter-spacing: 1px;
  margin-bottom: 4px;
  background: linear-gradient(90deg, var(--gold), var(--poison));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ggm-tagline {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 22px;
  letter-spacing: 2px;
}

.ggm-card {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.ggm-h {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 18px;
  margin: 0 0 14px;
  color: var(--cream);
  display: flex;
  align-items: center;
  gap: 8px;
}

.ggm-eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.ggm-btn {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  transition: transform .12s ease, filter .12s ease;
  color: #1a1024;
  background: linear-gradient(180deg, var(--gold), #e6a200);
}
.ggm-btn:active { transform: scale(0.98); }
.ggm-btn:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
.ggm-btn.secondary {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--cream);
}
.ggm-btn.poison { background: linear-gradient(180deg, var(--poison), #3f9a3c); color: #0d1f0c; }
.ggm-btn.antidote { background: linear-gradient(180deg, var(--antidote), #2e6fd6); color: #0c1a33; }
.ggm-btn.danger { background: linear-gradient(180deg, var(--danger), #c93a4f); color: #2b0a10; }

.ggm-row { display: flex; gap: 10px; }
.ggm-row > * { flex: 1; }

.ggm-input, .ggm-select {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-panel-2);
  color: var(--cream);
  font-size: 14px;
  font-family: 'Zen Maru Gothic', sans-serif;
}
.ggm-input::placeholder { color: #6f6088; }

.ggm-name-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ggm-name-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bg-panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--muted); flex-shrink: 0;
}

.ggm-target-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.ggm-target {
  padding: 10px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-panel-2);
  text-align: center;
  font-size: 14px;
  cursor: pointer;
  position: relative;
}
.ggm-target.selected { border-color: var(--gold); background: #3a2b16; }
.ggm-target.blocked { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
.ggm-target-tag {
  font-size: 10px; color: var(--muted); display: block; margin-top: 2px;
}

.ggm-lifebar { display: flex; gap: 4px; }
.ggm-heart { width: 12px; height: 12px; border-radius: 3px; background: var(--danger); }
.ggm-heart.lost { background: #3d2c3a; }

.ggm-player-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.ggm-player-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; border-radius: 10px; background: var(--bg-panel-2);
  border: 1px solid var(--line);
}
.ggm-player-item.dead { opacity: 0.4; }
.ggm-pname { font-weight: 700; font-family: 'Baloo 2', sans-serif; font-size: 14px; }

.ggm-timer {
  font-family: 'Baloo 2', sans-serif;
  font-size: 34px;
  text-align: center;
  letter-spacing: 2px;
  margin: 6px 0 16px;
  color: var(--gold);
}

.ggm-reveal-name {
  text-align: center;
  font-family: 'Baloo 2', sans-serif;
  font-size: 20px;
  margin-bottom: 6px;
}
.ggm-reveal-line {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  margin: 14px 0 8px;
}
.ggm-reveal-line.safe { color: var(--poison); }
.ggm-reveal-line.out { color: var(--danger); }
.ggm-reveal-counts {
  display: flex; justify-content: center; gap: 18px;
  font-size: 13px; color: var(--muted); margin-bottom: 18px;
}
.ggm-count-chip { display: flex; align-items: center; gap: 6px; }
.ggm-dot { width: 9px; height: 9px; border-radius: 50%; }
.ggm-dot.p { background: var(--poison); }
.ggm-dot.a { background: var(--antidote); }

.ggm-log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ggm-log-table th, .ggm-log-table td {
  border-bottom: 1px solid var(--line);
  padding: 7px 4px;
  text-align: left;
}
.ggm-log-table th { color: var(--muted); font-weight: 500; }

.ggm-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

.ggm-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  margin-left: 6px;
}
.ggm-badge.p { background: rgba(107,217,104,0.15); color: var(--poison); }
.ggm-badge.a { background: rgba(77,150,255,0.15); color: var(--antidote); }

.ggm-cover-img {
  width: 100%;
  border-radius: 16px;
  display: block;
  margin-bottom: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.ggm-ogp-corner {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
  display: block;
  margin: 0 auto 6px;
}
.ggm-drink-img {
  width: 140px;
  display: block;
  margin: 0 auto 10px;
  border-radius: 14px;
}
.ggm-result-img {
  width: 180px;
  display: block;
  margin: 0 auto 12px;
  border-radius: 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.4);
}
.ggm-reveal-fade {
  transition: opacity .35s ease;
}

.ggm-quit-link {
  display: block;
  margin: 20px auto 0;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  font-family: 'Zen Maru Gothic', sans-serif;
  width: auto;
}
.ggm-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,6,16,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}
.ggm-modal-card {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  width: 100%;
  max-width: 320px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
</style>

<div class="ggm-root">
  <div class="ggm-shell" id="ggm-app"></div>
</div>

(function(){
  const root = document.getElementById('ggm-app');

  // ---------- state ----------
  let state = {
    phase: 'rules',       // rules | setup | talk | vote | voteComplete | reveal | roundEnd | gameOver
    playerCount: 6,
    names: [],
    players: [],          // {name, life, lastTargetedBy: null} lastTarget per player: last player THEY targeted (non-self)
    round: 1,
    voteQueue: [],         // order of alive player indices to take their turn
    voteIndex: 0,
    actions: [],           // {actorIdx, targetIdx, type: 'poison'|'antidote'}
    revealQueue: [],
    revealIndex: 0,
    log: [],               // full history for the "投票履歴" viewer: {round, actorName, targetName, type}
    elapsed: 0,
    timerId: null,
    currentTargetSel: null,
    currentActionSel: null,
    showHistory: false,
    currentRoundResults: {}, // playerIdx -> {poisonCount, antidoteCount, out}  (being filled in during this round's reveal)
    lastRoundResults: {},    // playerIdx -> {poisonCount, antidoteCount, out}  (finalized results of the previous round)
  };

  const GGM_INGAME_PHASES = ['talk','vote','voteComplete','reveal','roundEnd'];

  function render(){
    if (state.phase === 'rules') { renderRules(); return; }
    if (state.phase === 'setup') { renderSetup(); return; }
    if (state.phase === 'talk') { renderTalk(); }
    else if (state.phase === 'vote') { renderVote(); }
    else if (state.phase === 'voteComplete') { renderVoteComplete(); }
    else if (state.phase === 'reveal') { renderReveal(); }
    else if (state.phase === 'roundEnd') { renderRoundEnd(); }
    else if (state.phase === 'gameOver') { renderGameOver(); return; }

    if (GGM_INGAME_PHASES.includes(state.phase)) appendQuitControls();
  }

  function appendQuitControls(){
    root.insertAdjacentHTML('beforeend', `
      <button class="ggm-quit-link" id="ggm-quit-btn">トップへ戻る</button>
      <div class="ggm-modal-overlay" id="ggm-quit-modal" style="display:none;">
        <div class="ggm-modal-card">
          <div class="ggm-h" style="justify-content:center;">ゲームをやめる?</div>
          <div class="ggm-note" style="text-align:center; margin-bottom:16px;">今の進行状況は消えて、トップ画面に戻る。</div>
          <div class="ggm-row">
            <button class="ggm-btn secondary" id="ggm-quit-cancel">キャンセル</button>
            <button class="ggm-btn danger" id="ggm-quit-confirm">やめる</button>
          </div>
        </div>
      </div>
    `);
    const quitBtn = root.querySelector('#ggm-quit-btn');
    const modal = root.querySelector('#ggm-quit-modal');
    quitBtn.onclick = ()=>{ modal.style.display = 'flex'; };
    root.querySelector('#ggm-quit-cancel').onclick = ()=>{ modal.style.display = 'none'; };
    root.querySelector('#ggm-quit-confirm').onclick = ()=>{
      clearInterval(state.timerId);
      state = {
        phase: 'rules', playerCount: state.playerCount, names: [], players: [],
        round: 1, voteQueue: [], voteIndex: 0, actions: [], revealQueue: [], revealIndex: 0,
        log: [], elapsed: 0, timerId: null, currentTargetSel: null, currentActionSel: null,
        showHistory: false, currentRoundResults: {}, lastRoundResults: {},
      };
      render();
    };
  }

  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- RULES ----------
  function renderRules(){
    root.innerHTML = `
      <img class="ggm-cover-img" src="${GGM_IMG.cover}" alt="ゴクゴクモンキー">
      <div class="ggm-tagline" style="font-size:15px; color:var(--gold); letter-spacing:1px; margin-bottom:18px;">次の一杯、盛るか盛られるか。</div>

      <div class="ggm-card">
        <div class="ggm-eyebrow" style="text-align:center;">シェアする</div>
        <div class="ggm-row">
          <button class="ggm-btn" id="share-line-btn" style="background:linear-gradient(180deg,#06c755,#04a648); color:#eafff0;">LINEで送る</button>
          <button class="ggm-btn" id="share-x-btn" style="background:linear-gradient(180deg,#1a1a1a,#000); color:#fff;">Xでポスト</button>
        </div>
        <button class="ggm-btn secondary" id="copy-url-btn" style="margin-top:8px;">🔗 URLをコピー</button>
        <div class="ggm-note" id="copy-feedback" style="text-align:center; min-height:16px;"></div>
      </div>

      <div class="ggm-card">
        <div class="ggm-h">📜 ルール説明</div>
        <div class="ggm-note" style="font-size:13px; line-height:1.9;">
          <b style="color:var(--cream)">① 会話タイム</b><br>
          全員で自由に話す。終わったら「会話終了」で次へ。<br><br>

          <b style="color:var(--cream)">② 毒盛りタイム</b><br>
          携帯を回して1人ずつ、誰かの飲み物に<span class="ggm-badge p">毒</span>か<span class="ggm-badge a">解毒</span>を1つだけ仕込む。<br>
          ・同じ相手に連続ターンで毒は盛れない(自分にだけは毎ターン毒を盛れる)<br>
          ・解毒は自分にも使える<br><br>

          <b style="color:var(--cream)">③ ドリンクタイム</b><br>
          1人ずつ順番に結果発表。<br>
          ・毒だけ入ってた → <b>アウト</b>(うっ)<br>
          ・毒+解毒1つ以上 → セーフ(変な味)<br>
          ・毒なしで解毒3つ以上 → <b>アウト</b>(飲み過ぎで毒化)<br>
          ・何もない/解毒1〜2つ → セーフ(ただのビール)<br><br>

          <b style="color:var(--cream)">④ ライフと終了条件</b><br>
          各プレイヤーライフ2からスタート。アウトでライフ-1、その場で罰ゲーム。<br>
          誰か1人がライフ0になった時点で終了、その人が負け。<br><br>

          <b style="color:var(--cream)">💡自分に毒を盛る、という賭け</b><br>
          解毒が集まりすぎて毒化しそうな時、自分から自分に毒を盛ると「毒あり」扱いになり、誰かが解毒すればセーフになる。ただし誰も解毒しなければそのままアウト、というリスクある保険。
        </div>
      </div>

      <button class="ggm-btn" id="rules-next-btn">わかった、はじめる</button>
    `;
    root.querySelector('#rules-next-btn').onclick = ()=>{
      state.phase = 'setup';
      render();
    };

    const shareText = 'ゴクゴクモンキー 〜次の一杯、盛るか盛られるか。〜';
    const pageUrl = window.location.href;

    root.querySelector('#share-line-btn').onclick = ()=>{
      const url = `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(shareText)}`;
      window.open(url, '_blank');
    };
    root.querySelector('#share-x-btn').onclick = ()=>{
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(pageUrl)}`;
      window.open(url, '_blank');
    };
    root.querySelector('#copy-url-btn').onclick = ()=>{
      const feedback = root.querySelector('#copy-feedback');
      const done = ()=>{ feedback.textContent = 'コピーしました!'; setTimeout(()=>{ if(feedback) feedback.textContent=''; }, 2000); };
      const fail = ()=>{ feedback.textContent = 'コピーできなかった、URL欄から手動でコピーしてくれ。'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(pageUrl).then(done).catch(fail);
      } else {
        try {
          const ta = document.createElement('textarea');
          ta.value = pageUrl;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        } catch(e) { fail(); }
      }
    };
  }

  // ---------- SETUP ----------
  function renderSetup(){
    if (state.names.length !== state.playerCount) {
      const prev = state.names;
      state.names = Array.from({length: state.playerCount}, (_,i)=> prev[i] || '');
    }
    root.innerHTML = `
      <img class="ggm-cover-img" src="${GGM_IMG.cover}" alt="ゴクゴクモンキー">

      <div class="ggm-card">
        <div class="ggm-h">🐒 参加人数</div>
        <div class="ggm-row" style="margin-bottom:4px;">
          ${[5,6,7,8].map(n => `<button class="ggm-btn ${n===state.playerCount?'':'secondary'}" data-count="${n}" style="padding:10px;">${n}人</button>`).join('')}
        </div>
      </div>

      <div class="ggm-card">
        <div class="ggm-h">📝 参加者の名前</div>
        ${state.names.map((n,i)=>`
          <div class="ggm-name-row">
            <div class="ggm-name-num">${i+1}</div>
            <input class="ggm-input" data-name-idx="${i}" placeholder="プレイヤー${i+1}" value="${escapeHtml(n)}">
          </div>
        `).join('')}
        <div class="ggm-note">名前を空欄のままにすると「プレイヤーN」で開始する。</div>
      </div>

      <button class="ggm-btn" id="start-btn">ルールを確認してゲーム開始</button>
    `;

    root.querySelectorAll('[data-count]').forEach(btn=>{
      btn.onclick = ()=>{ state.playerCount = parseInt(btn.dataset.count); render(); };
    });
    root.querySelectorAll('[data-name-idx]').forEach(inp=>{
      inp.oninput = ()=>{ state.names[parseInt(inp.dataset.nameIdx)] = inp.value; };
    });
    root.querySelector('#start-btn').onclick = ()=>{
      state.players = state.names.map((n,i)=>({
        name: (n && n.trim()) ? n.trim() : `プレイヤー${i+1}`,
        life: 2,
        lastTarget: null, // index of the last player (not self) this player targeted
      }));
      state.round = 1;
      startTalk();
    };
  }

  // ---------- TALK ----------
  function startTalk(){
    state.phase = 'talk';
    state.elapsed = 0;
    clearInterval(state.timerId);
    state.timerId = setInterval(()=>{
      state.elapsed++;
      const t = root.querySelector('#ggm-timer-display');
      if (t) t.textContent = fmtTime(state.elapsed);
    }, 1000);
    render();
  }

  function fmtTime(sec){
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    return `${m}:${s}`;
  }

  function renderTalk(){
    const hasHistory = state.round > 1 && Object.keys(state.lastRoundResults).length > 0;
    root.innerHTML = `
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-tagline">第${state.round}ターン ・ 会話タイム</div>

      <div class="ggm-card">
        <div class="ggm-eyebrow">経過時間(目安)</div>
        <div class="ggm-timer" id="ggm-timer-display">${fmtTime(state.elapsed)}</div>
        <button class="ggm-btn" id="talk-end-btn">会話終了 → 毒盛りタイムへ</button>
      </div>

      ${renderPlayerList({showBreakdown: hasHistory})}
    `;
    root.querySelector('#talk-end-btn').onclick = ()=>{
      clearInterval(state.timerId);
      startVote();
    };
  }

  function renderPlayerList(opts){
    opts = opts || {};
    return `
      <div class="ggm-card">
        <div class="ggm-h">👥 参加者</div>
        ${opts.showBreakdown ? '<div class="ggm-note" style="margin-bottom:8px;">前回の内訳:</div>' : ''}
        <div class="ggm-player-list">
          ${state.players.map((p,i)=>{
            const r = opts.showBreakdown ? state.lastRoundResults[i] : null;
            return `
            <div class="ggm-player-item ${p.life<=0?'dead':''}">
              <div>
                <div class="ggm-pname">${escapeHtml(p.name)}</div>
                ${r ? `<div class="ggm-note" style="margin-top:2px;">毒${r.poisonCount}・解毒${r.antidoteCount} ${r.out ? '(アウトした)' : ''}</div>` : ''}
              </div>
              <div class="ggm-lifebar">
                ${[0,1].map(j=>`<div class="ggm-heart ${j < p.life ? '' : 'lost'}"></div>`).join('')}
              </div>
            </div>
          `;}).join('')}
        </div>
      </div>
    `;
  }

  // ---------- VOTE (毒盛りタイム) ----------
  function startVote(){
    state.phase = 'vote';
    state.voteQueue = state.players
      .map((p,i)=>i)
      .filter(i => state.players[i].life > 0);
    state.voteIndex = 0;
    state.actions = [];
    state.currentRoundResults = {};
    state.currentTargetSel = null;
    state.currentActionSel = null;
    render();
  }

  function renderVote(){
    const actorIdx = state.voteQueue[state.voteIndex];
    const actor = state.players[actorIdx];

    const targets = state.players.map((p,i)=>({p,i})).filter(t => t.p.life > 0);

    root.innerHTML = `
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-tagline">毒盛りタイム (${state.voteIndex+1}/${state.voteQueue.length})</div>

      <div class="ggm-card">
        <img class="ggm-drink-img" src="${GGM_IMG.thinking}" alt="thinking" style="width:220px;">
        <div class="ggm-h" style="justify-content:center;">${escapeHtml(actor.name)} の番です</div>

        <div class="ggm-eyebrow" style="margin-top:14px;">誰に?</div>
        <div class="ggm-target-grid" id="target-grid">
          ${targets.map(({p,i})=>{
            const isSelf = i === actorIdx;
            const blockedAsPoison = (!isSelf) && (actor.lastTarget === i);
            const selected = state.currentTargetSel === i;
            return `<div class="ggm-target ${selected?'selected':''}" data-target="${i}">
              ${escapeHtml(p.name)}${isSelf?'<span class="ggm-target-tag">(自分)</span>':''}
              ${blockedAsPoison ? '<span class="ggm-target-tag">前回毒→毒不可</span>' : ''}
            </div>`;
          }).join('')}
        </div>

        <div class="ggm-eyebrow">何を仕込む?</div>
        <div class="ggm-row" style="margin-bottom:16px;">
          <button class="ggm-btn poison" id="act-poison" style="opacity:${state.currentActionSel==='poison'?1:0.55}">🧪 毒を盛る</button>
          <button class="ggm-btn antidote" id="act-antidote" style="opacity:${state.currentActionSel==='antidote'?1:0.55}">💊 解毒する</button>
        </div>

        <button class="ggm-btn" id="confirm-btn" disabled>この内容で決定</button>
        <div class="ggm-note" id="vote-warning"></div>
      </div>
    `;

    root.querySelectorAll('[data-target]').forEach(el=>{
      el.onclick = ()=>{
        const idx = parseInt(el.dataset.target);
        state.currentTargetSel = idx;
        state.currentActionSel = null; // reset action choice on target change to re-validate
        render();
      };
    });
    root.querySelector('#act-poison').onclick = ()=> trySetAction('poison', actorIdx);
    root.querySelector('#act-antidote').onclick = ()=> trySetAction('antidote', actorIdx);

    updateConfirmState(actorIdx);
  }

  function trySetAction(type, actorIdx){
    const targetIdx = state.currentTargetSel;
    const warnEl = root.querySelector('#vote-warning');
    if (targetIdx === null || targetIdx === undefined) {
      warnEl.textContent = '先に対象を選んでください。';
      return;
    }
    const isSelf = targetIdx === actorIdx;
    if (type === 'poison' && !isSelf && state.players[actorIdx].lastTarget === targetIdx) {
      warnEl.textContent = 'このプレイヤーには前ターン毒を盛っているため、連続では毒を盛れません(自分になら毎ターン盛れます)。';
      return;
    }
    warnEl.textContent = '';
    state.currentActionSel = type;
    render();
  }

  function updateConfirmState(actorIdx){
    const btn = root.querySelector('#confirm-btn');
    if (!btn) return;
    const ready = state.currentTargetSel !== null && state.currentActionSel !== null;
    btn.disabled = !ready;
    btn.onclick = ()=>{
      const targetIdx = state.currentTargetSel;
      const type = state.currentActionSel;
      state.actions.push({actorIdx, targetIdx, type});
      state.log.push({
        round: state.round,
        actorName: state.players[actorIdx].name,
        targetName: state.players[targetIdx].name,
        type
      });
      if (targetIdx !== actorIdx) {
        state.players[actorIdx].lastTarget = targetIdx;
      }
      state.currentTargetSel = null;
      state.currentActionSel = null;
      state.voteIndex++;
      if (state.voteIndex >= state.voteQueue.length) {
        state.phase = 'voteComplete';
        render();
      } else {
        render();
      }
    };
  }

  function renderVoteComplete(){
    root.innerHTML = `
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-card" style="text-align:center;">
        <img class="ggm-drink-img" src="${GGM_IMG.drink}" alt="drink" style="width:180px;">
        <div class="ggm-h" style="justify-content:center; font-size:20px;">全員選択完了!</div>
        <div class="ggm-note" style="margin-bottom:16px;">誰が誰に何を仕込んだか、もう決まってる。</div>
        <button class="ggm-btn" id="to-reveal-btn">ドリンクタイムへ</button>
      </div>
    `;
    root.querySelector('#to-reveal-btn').onclick = ()=>{
      startReveal();
    };
  }

  // ---------- REVEAL (ドリンクタイム) ----------
  function startReveal(){
    state.phase = 'reveal';
    state.revealQueue = state.voteQueue.slice(); // same alive-at-start-of-round set, in order
    state.revealIndex = 0;
    render();
  }

  function judgeFor(playerIdx){
    let poisonCount = 0, antidoteCount = 0;
    state.actions.forEach(a=>{
      if (a.targetIdx === playerIdx) {
        if (a.type === 'poison') poisonCount++;
        else antidoteCount++;
      }
    });
    let out, line, img;
    if (poisonCount === 0 && antidoteCount <= 2) { out = false; line = '大丈夫、ただのビール'; img = 'safe'; }
    else if (poisonCount === 0 && antidoteCount >= 3) { out = true; line = '大丈夫だけど、、、うっ(飲み過ぎで毒化)'; img = 'overdose'; }
    else if (poisonCount >= 1 && antidoteCount === 0) { out = true; line = 'うっ'; img = 'poison'; }
    else { out = false; line = '大丈夫だけど、変な味'; img = 'detox'; }
    return {poisonCount, antidoteCount, out, line, img};
  }

  function renderReveal(){
    const playerIdx = state.revealQueue[state.revealIndex];
    const p = state.players[playerIdx];
    const result = judgeFor(playerIdx);

    root.innerHTML = `
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-tagline">ドリンクタイム (${state.revealIndex+1}/${state.revealQueue.length})</div>

      <div class="ggm-card">
        <div class="ggm-reveal-name">🍺 ${escapeHtml(p.name)} が飲む</div>
        <img class="ggm-result-img ggm-reveal-fade" id="reveal-img" src="${GGM_IMG.drink}" alt="ゴクゴク...">
        <div class="ggm-reveal-line ggm-reveal-fade" id="reveal-line" style="opacity:0;">ゴクゴク、、、</div>
        <div class="ggm-reveal-counts ggm-reveal-fade" id="reveal-counts" style="opacity:0;"></div>
        <button class="ggm-btn" id="next-reveal-btn" style="visibility:hidden;">次へ</button>
      </div>
    `;

    // ステージ1: 飲む演出(即時) → ステージ2: 結果画像+セリフ → ステージ3: 数値+次へボタン
    // ここに将来RVC音声の再生タイミングを差し込む(ステージ2で結果セリフの音声、ステージ3で数値の効果音、など)
    setTimeout(()=>{
      const img = root.querySelector('#reveal-img');
      const line = root.querySelector('#reveal-line');
      if (!img || !line) return;
      img.style.opacity = 0;
      setTimeout(()=>{
        img.src = GGM_IMG[result.img];
        img.classList.add(result.out ? 'out' : 'safe');
        img.style.opacity = 1;
        line.textContent = result.line;
        line.className = `ggm-reveal-line ggm-reveal-fade ${result.out?'out':'safe'}`;
        line.style.opacity = 1;
      }, 250);
    }, 1100);

    setTimeout(()=>{
      const counts = root.querySelector('#reveal-counts');
      const btn = root.querySelector('#next-reveal-btn');
      if (!counts || !btn) return;
      counts.innerHTML = `
        <div class="ggm-count-chip"><div class="ggm-dot p"></div>毒 ${result.poisonCount}個</div>
        <div class="ggm-count-chip"><div class="ggm-dot a"></div>解毒 ${result.antidoteCount}個</div>
      `;
      counts.style.opacity = 1;
      btn.style.visibility = 'visible';
      btn.className = `ggm-btn ${result.out?'danger':''}`;
      btn.textContent = result.out ? 'ライフ-1 して次へ' : '次へ';
    }, 2200);

    root.querySelector('#next-reveal-btn').onclick = ()=>{
      state.currentRoundResults[playerIdx] = {
        poisonCount: result.poisonCount,
        antidoteCount: result.antidoteCount,
        out: result.out
      };
      if (result.out) {
        p.life -= 1;
      }
      state.revealIndex++;
      if (state.revealIndex >= state.revealQueue.length) {
        checkRoundEnd();
      } else {
        render();
      }
    };
  }

  function checkRoundEnd(){
    state.lastRoundResults = state.currentRoundResults;
    const eliminated = state.players.filter(p => p.life <= 0);
    if (eliminated.length > 0) {
      state.phase = 'gameOver';
      render();
    } else {
      state.phase = 'roundEnd';
      render();
    }
  }

  function renderRoundEnd(){
    root.innerHTML = `
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-tagline">第${state.round}ターン 終了</div>
      ${renderPlayerList()}
      <button class="ggm-btn" id="next-round-btn">次のターンへ(会話タイム)</button>
    `;
    root.querySelector('#next-round-btn').onclick = ()=>{
      state.round++;
      startTalk();
    };
  }

  // ---------- GAME OVER ----------
  function renderGameOver(){
    const loser = state.players.find(p=>p.life<=0);
    root.innerHTML = `
      <img class="ggm-ogp-corner" src="${GGM_IMG.ogp}" alt="ゴクゴクモンキー">
      <div class="ggm-logo">ゴクゴクモンキー</div>
      <div class="ggm-tagline">ゲーム終了</div>

      <div class="ggm-card" style="text-align:center;">
        <div class="ggm-eyebrow">脱落</div>
        <div class="ggm-h" style="justify-content:center; font-size:22px;">💀 ${escapeHtml(loser.name)}</div>
        <div class="ggm-note">罰ゲームの時間だ。</div>
      </div>

      ${renderPlayerList()}

      <div class="ggm-card">
        <button class="ggm-btn secondary" id="toggle-history-btn">
          ${state.showHistory ? '投票履歴を隠す' : '🕵️ 投票履歴を見る'}
        </button>
        ${state.showHistory ? renderHistoryTable() : ''}
      </div>

      <button class="ggm-btn" id="restart-btn">最初からもう一度</button>
    `;
    root.querySelector('#toggle-history-btn').onclick = ()=>{
      state.showHistory = !state.showHistory;
      render();
    };
    root.querySelector('#restart-btn').onclick = ()=>{
      clearInterval(state.timerId);
      state = {
        phase: 'setup', playerCount: state.playerCount, names: [], players: [],
        round: 1, voteQueue: [], voteIndex: 0, actions: [], revealQueue: [], revealIndex: 0,
        log: [], elapsed: 0, timerId: null, currentTargetSel: null, currentActionSel: null,
        showHistory: false, currentRoundResults: {}, lastRoundResults: {},
      };
      render();
    };
  }

  function renderHistoryTable(){
    return `
      <table class="ggm-log-table">
        <thead><tr><th>ターン</th><th>誰が</th><th>誰に</th><th>何を</th></tr></thead>
        <tbody>
          ${state.log.map(l=>`
            <tr>
              <td>${l.round}</td>
              <td>${escapeHtml(l.actorName)}</td>
              <td>${escapeHtml(l.targetName)}</td>
              <td>${l.type==='poison' ? '<span class="ggm-badge p">毒</span>' : '<span class="ggm-badge a">解毒</span>'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  render();
})();
</script>
